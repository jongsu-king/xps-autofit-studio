[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xps-autofit"
dynamic = ["version"]
description = "Automated, reproducible XPS peak fitting with physical constraints and batch processing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jongsu Lim" }]
keywords = ["XPS", "photoelectron spectroscopy", "peak fitting", "Shirley", "Tougaard", "Voigt", "VAMAS"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "lmfit>=1.3",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "pandas-stubs",
]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13"]

[project.scripts]
xps-autofit = "xps_autofit.cli:main"

[project.urls]
Homepage = "https://github.com/jongsu-king/xps-autofit-studio"
Documentation = "https://github.com/jongsu-king/xps-autofit-studio/tree/main/docs"
Changelog = "https://github.com/jongsu-king/xps-autofit-studio/blob/main/CHANGELOG.md"
Source = "https://github.com/jongsu-king/xps-autofit-studio"
Issues = "https://github.com/jongsu-king/xps-autofit-studio/issues"
Releases = "https://github.com/jongsu-king/xps-autofit-studio/releases"

[tool.hatch.version]
path = "src/xps_autofit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xps_autofit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "CITATION.cff", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "SIM"]
ignore = ["B905"]

[tool.mypy]
python_version = "3.11"
packages = ["xps_autofit"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning:xps_autofit"]
