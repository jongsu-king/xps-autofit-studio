name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libfontconfig1
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,gui]"
      - name: Lint
        run: ruff check src tests examples packaging && ruff format --check src tests examples packaging
      - name: Type check
        run: mypy
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        # Coverage tracing doubles the test time on Python 3.11 (measured locally:
        # 45 s -> 92 s for the model-selection tests), so one job measures it and the
        # others only run the tests.
        run: >-
          pytest -q
          ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
          && '--cov=xps_autofit --cov-report=term-missing' || '' }}
      - name: Smoke test the CLI
        shell: bash
        run: |
          xps-autofit synth --out ci_data
          xps-autofit fit ci_data/p3ht_aged_multi.vms --recipe p3ht --output ci_out --formats csv,json,png
          xps-autofit verify ci_out/p3ht_aged_multi__S_2p.json

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
