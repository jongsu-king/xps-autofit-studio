name: Publish to PyPI

# Builds the wheel and sdist of a release and uploads them to PyPI through trusted
# publishing (OpenID Connect): no API token is stored anywhere.  The publisher must be
# registered once on PyPI (project xps-autofit, this repository, workflow
# publish.yml, environment pypi).  Until then the upload job is skipped on release
# events; a manual run always tries.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (for example v0.4.1)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
          ls -l dist
      - name: Version matches the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(PYTHONPATH=src python -c 'import xps_autofit; print(xps_autofit.__version__)')
          echo "tag $TAG, package $VERSION"
          test "$TAG" = "v$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.PYPI_TRUSTED_PUBLISHER == 'configured'
    environment:
      name: pypi
      url: https://pypi.org/project/xps-autofit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
